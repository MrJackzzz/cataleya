services:
  postgres:
    image: postgres:16-alpine
    container_name: cataleya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cataleya
      POSTGRES_PASSWORD: cambiar-esta-clave
      POSTGRES_DB: cataleya
    ports:
      - "5432:5432"
    volumes:
      - cataleya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cataleya -d cataleya"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cataleya_pgdata:
